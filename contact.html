<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — El Mehdi FATAHLLAH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar-custom">
        <div class="container" style="max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;">
            <a class="navbar-brand-custom" href="index.html">EMF<span style="opacity:0.5">.</span></a>
            <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('active')" aria-label="Menu">
                <i class="bi bi-list"></i>
            </button>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="propos.html">À Propos</a></li>
                <li><a href="formation.html">Formation</a></li>
                <li><a href="projets.html">Projets</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contact -->
    <main class="main-content">
        <section class="contact-section">
            <div class="section-header animate-in">
                <span class="section-tag"><i class="bi bi-send-fill"></i> Contact</span>
                <h1 class="section-title">Contactez-Moi</h1>
                <p class="section-subtitle">N'hésitez pas à me contacter pour toute question ou collaboration</p>
            </div>

            <!-- Contact Info Cards -->
            <div class="animate-in delay-1 contact-info-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem;">
                <div class="card-custom" style="text-align:center;padding:1.5rem 1rem;">
                    <div class="info-icon" style="margin:0 auto 0.75rem;"><i class="bi bi-envelope"></i></div>
                    <div class="info-label">Email</div>
                    <div class="info-value" style="font-size:0.85rem;">elmehdifatahllah@gmail.com</div>
                </div>
                <div class="card-custom" style="text-align:center;padding:1.5rem 1rem;">
                    <div class="info-icon" style="margin:0 auto 0.75rem;"><i class="bi bi-geo-alt"></i></div>
                    <div class="info-label">Localisation</div>
                    <div class="info-value" style="font-size:0.85rem;">Casablanca, Maroc</div>
                </div>
                <div class="card-custom" style="text-align:center;padding:1.5rem 1rem;">
                    <div class="info-icon" style="margin:0 auto 0.75rem;"><i class="bi bi-linkedin"></i></div>
                    <div class="info-label">LinkedIn</div>
                    <a href="https://www.linkedin.com/in/el-mehdi-fatahllah-3b41842b9/" target="_blank" style="color:var(--primary-light);font-size:0.85rem;text-decoration:none;font-weight:500;">Voir le profil</a>
                </div>
            </div>

            <!-- Form -->
            <div class="form-card animate-in delay-2">
                <form action="https://formspree.io/f/xlderoee" method="POST">
                    <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">
                        <div class="form-group">
                            <label class="form-label-custom">Nom <span class="required">*</span></label>
                            <input type="text" name="nom" class="form-input" placeholder="Votre nom" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label-custom">Prénom <span class="required">*</span></label>
                            <input type="text" name="prenom" class="form-input" placeholder="Votre prénom" required>
                        </div>
                    </div>

                    <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">
                        <div class="form-group">
                            <label class="form-label-custom">Téléphone</label>
                            <input type="tel" name="téléphone" class="form-input" placeholder="Votre numéro de téléphone">
                        </div>
                        <div class="form-group">
                            <label class="form-label-custom">Email</label>
                            <input type="email" name="email" class="form-input" placeholder="Votre email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label-custom">Message <span class="required">*</span></label>
                        <textarea name="description" rows="5" class="form-input" placeholder="Décrivez votre projet ou votre question..." required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="bi bi-send"></i> Envoyer le message
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer-custom">
        <p>&copy; 2026 El Mehdi FATAHLLAH. Tous droits réservés.</p>
    </footer>
</body>

</html>
